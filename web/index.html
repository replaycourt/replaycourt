<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://test.rpc.fastnear.com https://near-testnet.drpc.org; object-src 'none'; base-uri 'none'; form-action 'none'">

<title>ReplayCourt explorer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<header class="top">
